[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workstation-tidy"
version = "0.1.0"
description = "Inspect and clean explicitly selected Ubuntu workstation caches and build outputs"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"

[project.scripts]
workstation-tidy = "workstation_tidy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
